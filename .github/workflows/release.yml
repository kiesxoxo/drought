name: Release

# Push a tag like v1.2.0 to publish drought.zip and drought.tar.gz
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install modules
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package
        run: |
          cp -r dist drought
          zip -r drought.zip drought
          tar -czvf drought.tar.gz drought

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            drought.zip
            drought.tar.gz
